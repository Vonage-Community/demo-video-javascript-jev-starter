<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://video.standard.vonage.com/v2/js/opentok.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #0b0b0b;
      --muted: #55655a;
      --border: #0b0b0b;
      --border-color: #0b0b0b;
      --accent: #1f6b3a;
      --accent-dark: #14472a;
      --accent-soft: #e6f2e9;
      --video-bg: #0b0b0b;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    /* The whole dashboard fits the window: call tile and sidebar share the same height. */
    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 1.5rem;
      max-width: 1500px;
      height: 100vh;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .dashboard-main,
    .dashboard-sidebar {
      min-height: 0;
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 6px 6px 0 var(--accent);
      padding: 1.25rem;
    }

    .dashboard-main { display: flex; flex-direction: column; gap: 1.25rem; }

    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    header h2 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
    header h2::before { content: "$ "; color: var(--accent); }
    header h2::after { content: "_"; color: var(--accent); animation: blink 1s steps(1) infinite; }

    #agent-video-controls { align-items: center; }

    button {
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.45rem 0.9rem;
      border: 2px solid var(--border);
      border-radius: 0;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
    }
    button::before { content: "[ "; color: var(--accent); }
    button::after { content: " ]"; color: var(--accent); }
    button:hover { background: var(--accent); color: #fff; }
    button:hover::before, button:hover::after { color: #fff; }
    button:active { transform: translate(2px, 2px); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .btn-danger { background: var(--border); color: #fff; }
    .btn-danger:hover { background: #000; color: #fff; }

    /* Static meme strip above the customer stream, cycling by itself */
    #meme-strip {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: none;
      margin-top: 0.4rem;
      padding: 0.8rem 1rem;
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 4px 4px 0 var(--accent);
    }
    #meme-strip::before {
      content: "meme.exe";
      position: absolute;
      top: -0.85rem;
      left: 0.8rem;
      padding: 0 0.5rem;
      background: var(--border);
      color: #fff;
      font-size: 0.72rem;
    }
    .meme-doodle { flex: none; font-size: 2.2rem; line-height: 1; }
    .meme-text { flex: 1; min-width: 0; }
    #meme-strip .meme-doodle, #meme-strip .meme-text { transition: opacity 0.15s ease; }
    #meme-strip.swap .meme-doodle, #meme-strip.swap .meme-text { opacity: 0; }
    #meme-top { margin: 0; font-weight: 700; }
    #meme-bottom { margin: 0.3rem 0 0; padding-top: 0.3rem; border-top: 2px dashed var(--accent); color: var(--accent); font-weight: 700; }

    .video-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: minmax(0, 1fr);
      gap: 1.25rem;
    }

    .video-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
      background: var(--video-bg);
      color: #bfe3c9;
      text-align: center;
      padding: 1rem;
      border: 2px solid var(--border);
      box-shadow: 4px 4px 0 var(--accent);
    }

    #publisher-container { align-self: end; aspect-ratio: 4 / 3; max-height: 100%; }

    .video-box > div,
    .video-box .OT_publisher,
    .video-box .OT_subscriber {
      position: absolute !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .dashboard-sidebar { display: flex; flex-direction: column; overflow: hidden; }

    .dashboard-sidebar > h3 { margin: 0; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .dashboard-sidebar > h3::before { content: "> "; color: var(--accent); }
    .dashboard-sidebar > hr { flex: none; margin: 0.4rem 0 0.6rem; border: none; height: 1.2em; overflow: hidden; }
    .dashboard-sidebar > hr::after {
      content: "~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*";
      display: block;
      white-space: nowrap;
      color: var(--accent);
    }

    #dashboard-alerts {
      flex: none;
      max-height: 30vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding: 0 6px 6px 0;
    }
    #dashboard-alerts:empty::before {
      content: "> no escalations. all quiet_";
      display: block;
      padding: 0.7rem 1rem;
      border: 2px dashed var(--muted);
      color: var(--muted);
    }

    /* The JEV card takes whatever height is left */
    #jev-slot { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 0.9rem; }

    .escalation-card {
      padding: 1rem 1.1rem;
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 4px 4px 0 var(--accent);
      animation: pop-in 0.2s ease;
    }
    .escalation-card h3 { margin: 0 0 0.5rem; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
    .escalation-card h3::before { content: "!! "; color: var(--text); }
    .escalation-card p { margin: 0.25rem 0; overflow-wrap: anywhere; }
    .escalation-card p strong { color: var(--accent-dark); }
    .escalation-card button { width: 100%; margin-top: 0.8rem; }

    @keyframes pop-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    @media (max-width: 900px) {
      .dashboard-layout { grid-template-columns: 1fr; height: auto; padding: 1rem; }
      .video-layout { grid-template-columns: 1fr; grid-template-rows: auto; }
      .video-box { min-height: 240px; }
      #publisher-container { aspect-ratio: auto; }
      .dashboard-sidebar { overflow: visible; }
      #jev-slot { min-height: 520px; }
    }
  </style>
</head>

<body>

  <div class="dashboard-layout">
    <main class="dashboard-main">
      <header>
        <h2>Active Support Call</h2>
        <div id="agent-video-controls" style="display: none; gap: 0.5rem;">
          <button id="agent-toggle-audio">Mute</button>
          <button id="agent-toggle-video">Stop Camera</button>
          <button id="agent-end-call" class="btn-danger">End Call</button>
        </div>
      </header>

      <section id="meme-strip" aria-label="Customer care meme">
        <span class="meme-doodle" id="meme-doodle"></span>
        <div class="meme-text">
          <p id="meme-top"></p>
          <p id="meme-bottom"></p>
        </div>
      </section>

      <section class="video-layout">
        <div id="subscriber-container" class="video-box">Waiting for customer stream...</div>
        <div id="publisher-container" class="video-box">Your camera</div>
      </section>
    </main>

    <aside class="dashboard-sidebar">
      <h3>Escalation Queue</h3>
      <hr>
      <div id="dashboard-alerts" aria-live="polite"></div>
      <div id="jev-slot"></div>
    </aside>
  </div>

  <script src="dashboard.js"></script>
  <script src="jev-panel.js"></script>

  <script>
    // Static meme strip: moves to a new customer care meme every 3 to 4 seconds.
    // Purely cosmetic and never touches the Vonage call logic.
    (function () {
      const memes = [
        { doodle: "🎧📞", top: "Customer: \"I'd like to speak to a manager.\"", bottom: "Manager: \"I'd like to speak to a manager.\"" },
        { doodle: "⏳🎶", top: "\"Your call is important to us.\"", bottom: "Hold music, minute 47: \"Is it, though?\"" },
        { doodle: "🔄💻", top: "\"Have you tried turning it off and on again?\"", bottom: "Me, 400 times today: yes, and I'd do it again." },
        { doodle: "📧😐", top: "\"Per my last email…\"", bottom: "Me, who has never seen that email: \"Great point.\"" },
        { doodle: "🔑🙃", top: "Password resets: 80% of my job", bottom: "The other 20%: explaining it's not me, it's the password." },
        { doodle: "🧯🔥", top: "Customer: \"IT'S URGENT!!!\"", bottom: "Ticket age: 4 minutes. Urgency: noted." },
        { doodle: "🤖➡️🧑", top: "Customer: \"I've already told the bot all this.\"", bottom: "Me: \"I know. I read the transcript. I'm so sorry.\"" },
        { doodle: "🪤👀", top: "Escalation queue: empty", bottom: "Me: this is a trap." },
        { doodle: "☕💬", top: "\"Sorry to hear that\" x 312 today", bottom: "Still means it. Mostly." },
        { doodle: "📝🤷", top: "Ticket description, in full: \"It's not working.\"", bottom: "Me: \"Love a challenge.\"" }
      ];

      const strip = document.getElementById("meme-strip");
      let last = -1;

      function render(i) {
        document.getElementById("meme-doodle").textContent = memes[i].doodle;
        document.getElementById("meme-top").textContent = memes[i].top;
        document.getElementById("meme-bottom").textContent = memes[i].bottom;
      }

      function next(first) {
        let i;
        do { i = Math.floor(Math.random() * memes.length); } while (i === last && memes.length > 1);
        last = i;
        if (first) {
          render(i);
        } else {
          strip.classList.add("swap");
          setTimeout(() => { render(i); strip.classList.remove("swap"); }, 150);
        }
        setTimeout(() => next(false), 3000 + Math.random() * 1000);
      }

      next(true);
    })();
  </script>
</body>

</html>
